name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: the tests only need to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pinned rather than ubuntu-latest: Python 3.8 and 3.9 aren't built for newer images.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml promises (requires-python >= 3.8).
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # Actions are pinned to commit SHAs; the comment says which release that is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install file-dropbox with its test tools
        run: python -m pip install ".[dev]"

      - name: Check the installed command
        run: file-dropbox --version

      - name: Run the tests
        run: python -m pytest -v
